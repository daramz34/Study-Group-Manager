<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account Â· StudyTogether</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/custom.css"></head><body class="min-h-screen grid place-items-center p-4"><main class="card w-full max-w-md p-8"><h1 class="text-2xl font-bold mb-6">Create your account</h1><form id="form" class="space-y-4"><label class="block text-sm font-medium">Username<input name="username" class="field mt-1" required minlength="2"></label><label class="block text-sm font-medium">Email<input name="email" type="email" class="field mt-1" required></label><label class="block text-sm font-medium">Password<input name="password" type="password" class="field mt-1" required minlength="6"></label><button class="btn btn-primary w-full">Create account</button><p id="msg" class="text-sm"></p></form><p class="text-center text-sm text-slate-500 mt-6">Already registered? <a class="text-indigo-600 font-semibold" href="auth.html">Sign in</a></p></main><script src="js/api.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.className="text-sm";try{await api.post("/auth/register",Object.fromEntries(new FormData(form)));msg.className+=" text-emerald-600";msg.textContent="Account created. You can now sign in.";form.reset()}catch(x){msg.className+=" text-red-600";msg.textContent=x.message}}</script></body></html>
