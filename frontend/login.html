<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in Â· StudyTogether</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/custom.css"></head><body class="min-h-screen grid place-items-center p-4"><main class="card w-full max-w-md p-8"><div class="text-center mb-8"><div class="text-3xl font-black">Study<span class="text-teal-500">Together</span></div><p class="text-slate-500 mt-2">Learn together, rank together.</p></div><form id="form" class="space-y-4"><label class="block text-sm font-medium">Username<input name="username" class="field mt-1" required></label><label class="block text-sm font-medium">Password<input name="password" type="password" class="field mt-1" required></label><button class="btn btn-primary w-full">Sign in</button><p id="msg" class="text-sm text-red-600"></p></form><p class="text-center text-sm text-slate-500 mt-6">New here? <a class="text-indigo-600 font-semibold" href="auth.html">Create an account</a></p></main><script src="js/api.js"></script><script>form.onsubmit=async e=>{e.preventDefault();msg.textContent="";const b=new URLSearchParams(new FormData(form));try{const d=await api.request("/auth/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:b});localStorage.setItem("sgm_token",d.access_token);location.href="dashboard.html"}catch(x){msg.textContent=x.message}}</script></body></html>
